<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img"
     aria-label="No picture yet">
    <!--
        Shown by upload_url() when a record has no image in it yet, so a card
        or a table row never shows a broken image. Colours come from the
        --bubapc-surface-muted and --bubapc-border tokens in css/style.css.
    -->
    <rect width="640" height="420" fill="#eef0f7"/>
    <rect x="0.5" y="0.5" width="639" height="419" fill="none"
          stroke="rgba(20,24,46,0.10)"/>
    <g fill="none" stroke="#a5aef0" stroke-width="8" stroke-linejoin="round">
        <rect x="236" y="150" width="168" height="126" rx="10"/>
        <path d="M236 232l42-40 38 34 34-30 54 48"/>
    </g>
    <circle cx="290" cy="188" r="14" fill="#a5aef0"/>
    <text x="320" y="330" text-anchor="middle" font-family="system-ui, sans-serif"
          font-size="24" fill="#626a8a">No picture yet</text>
</svg>
